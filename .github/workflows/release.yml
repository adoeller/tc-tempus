name: Manuelles Release (vorhandene ZIPs)

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog-Text für dieses Release"
        required: true
        type: string
      draft:
        description: "Als Entwurf erstellen?"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Als Pre-Release markieren?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository vollständig auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Projektname und Zeitstempel ermitteln
        id: meta
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          TAG_NAME="${PROJECT_NAME}-${TIMESTAMP}"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Vorhandene ZIP-Dateien suchen
        id: find
        run: |
          set -e
          mapfile -t ZIPS < <(find . -type f -iname "*.zip" ! -path "./.git/*")
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "Keine ZIP-Dateien im Repository gefunden – Abbruch." >&2
            exit 1
          fi
          printf '%s\n' "${ZIPS[@]}"
          {
            echo "assets<<EOF"
            printf '%s\n' "${ZIPS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "${{ steps.meta.outputs.tag_name }}" \
            ${{ steps.find.outputs.assets }} \
            --title "${{ steps.meta.outputs.project_name }} ${{ steps.meta.outputs.timestamp }}" \
            --notes "$CHANGELOG" \
            --generate-notes \
            "${FLAGS[@]}"
