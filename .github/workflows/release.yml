name: Manuelles Release (vorhandene Assets + optionales Source-Archiv)

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog-Text für dieses Release"
        required: true
        type: string
      draft:
        description: "Als Entwurf erstellen?"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Als Pre-Release markieren?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository vollständig auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Projektname und Zeitstempel ermitteln
        id: meta
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          TAG_NAME="${PROJECT_NAME}-${TIMESTAMP}"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      # Plugin-Dateien, Readme, License und vorhandene ZIPs einzeln finden
      - name: Vorhandene Assets suchen
        id: find
        run: |
          set -e
          mapfile -t ASSETS < <(find . -type f \( \
              -iname "*.wdx" -o -iname "*.wcx" -o -iname "*.wfx" \
              -o -iname "*.wdx64" -o -iname "*.wcx64" -o -iname "*.wfx64" \
              -o -iname "*.zip" \
              -o -iname "readme*" \
              -o -iname "license*" -o -iname "lizenz*" \
            \) ! -path "./.git/*" ! -path "./source/*")

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "Keine passenden Dateien im Repository gefunden – Abbruch." >&2
            exit 1
          fi
          printf '%s\n' "${ASSETS[@]}"
          {
            echo "assets<<EOF"
            printf '%s\n' "${ASSETS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Nur wenn der Ordner "source" existiert, wird daraus ein Archiv erzeugt
      - name: Source-Archiv erstellen (falls Ordner vorhanden)
        id: source
        run: |
          if [ -d "source" ]; then
            SOURCE_ZIP="${{ steps.meta.outputs.tag_name }}-source.zip"
            (cd source && zip -r "../$SOURCE_ZIP" .)
            echo "source_asset=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          else
            echo "Kein 'source'-Ordner gefunden, überspringe Source-Archiv."
            echo "source_asset=" >> "$GITHUB_OUTPUT"
          fi

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "${{ steps.meta.outputs.tag_name }}" \
            ${{ steps.find.outputs.assets }} \
            ${{ steps.source.outputs.source_asset }} \
            --title "${{ steps.meta.outputs.project_name }} ${{ steps.meta.outputs.timestamp }}" \
            --notes "$CHANGELOG" \
            --generate-notes \
            "${FLAGS[@]}"
